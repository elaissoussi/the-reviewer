name: Dust PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR changes
        id: changes
        run: |
          # Encode diff content to base64 to avoid formatting issues
          echo "diff=$(git diff ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | base64 -w 0)" >> $GITHUB_OUTPUT

      - name: Get Dust Analysis
        id: dust-analysis
        uses: indiesdev/curl@v1.1
        env:
          DUST_API_KEY: ${{ secrets.DUST_API_KEY }}
        with:
          url: 'https://dust.tt/api/v1/w/5494230b3c/assistant/conversations'
          method: 'POST'
          headers: '{
            "Content-Type": "application/json",
            "Accept": "application/json",
            "Authorization": "Bearer ${{ env.DUST_API_KEY }}"
          }'
          body: '{
            "message": {
              "content": "Review this PR diff: ${{ steps.changes.outputs.diff }}",
              "mentions": [{"configurationId": "PaI6fFlAyA"}],
              "context": {
                "username": "${{ github.actor }}",
                "timezone": "UTC",
                "fullName": "${{ github.actor }}",
                "email": "${{ github.actor }}@users.noreply.github.com",
                "origin": "github-action"
              }
            },
            "blocking": true
          }'
          timeout: 30000
          retries: 3

      - name: Review with Dust
        uses: actions/github-script@v7
        with:
          script: |
            const dustResponse = JSON.parse(${{ steps.dust-analysis.outputs.response }});
            const review = dustResponse.data.conversation.content[1][0].content;
            const title = dustResponse.data.conversation.title;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ${title} :mag:

              ${review}`
            });
